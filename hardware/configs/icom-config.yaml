references:
  - "Icom IC-F Series Service Manual"
  - "Icom IC-V/U Series User Manual"
  - "Icom Accessory Connector Specifications"
  - "ESP32 RoIP Hardware Validation Guide"
  - "Icom CS Cloning Software Manual"
  - "Icom 9600 Baud Packet Interface Documentation"
