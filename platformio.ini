; PlatformIO Project Configuration File for MMDVM ESP32 Port
;
; Build options:
;   - ESP32 DevKit V1 (generic ESP32-WROOM-32/WROVER)
;   - ESP32-S2 DevKit
;   - ESP32-S3 DevKit
;
; Upload: USB or Serial (depending on board)
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32
src_dir = .
include_dir = .

; ============================================================
; Common settings for all ESP32 variants
; ============================================================
[env]
framework = arduino
monitor_speed = 460800
upload_speed = 921600

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    ; MMDVM mode configuration (enable/disable as needed)
    -DMODE_DSTAR
    -DMODE_DMR
    -DMODE_YSF
    -DMODE_P25
    -DMODE_NXDN
    -DMODE_M17
    -DMODE_POCSAG
    -DMODE_FM
    -DMODE_AX25
    ; Other MMDVM options
    -DMODE_LEDS
    -DSEND_RSSI_DATA
    -DSERIAL_REPEATER
    -DUSE_DCBLOCKER
    -DUSE_ALTERNATE_M17_LEDS
    -DUSE_ALTERNATE_POCSAG_LEDS
    -DUSE_ALTERNATE_FM_LEDS
    ; Serial speed for host communication
    -DSERIAL_SPEED=460800
    -DSERIAL_REPEATER_BAUD_RATE=9600

; Source files to build
build_src_filter =
    +<*.cpp>
    +<*.c>
    -<IOSTM.cpp>
    -<IOTeensy.cpp>
    -<IODue.cpp>
    -<SerialSTM.cpp>
    -<SerialTeensy.cpp>
    -<SerialArduino.cpp>
    -<MMDVM.cpp>
    -<STM32F4XX_Lib/>
    -<STM32F7XX_Lib/>

; ============================================================
; ESP32 (Original) - Dual-core LX6, built-in DAC
; ============================================================
[env:esp32]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4

; For ESP32 DevKit boards with 4MB flash
board_build.flash_mode = dio
board_build.partitions = default.csv

; ============================================================
; ESP32-S2 - Single-core LX7, built-in DAC
; ============================================================
[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
board_build.mcu = esp32s2
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32S2
    -DESP32S2_GENERIC
    -DARM_MATH_CM4
    ; Reduced buffer sizes for ESP32-S2 (less RAM)
    -DREDUCED_BUFFERS

board_build.flash_mode = dio
board_build.partitions = default.csv

; USB CDC support for ESP32-S2
build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; ESP32-S3 - Dual-core LX7, NO built-in DAC (requires external)
; ============================================================
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32S3
    -DESP32S3_GENERIC
    -DARM_MATH_CM4
    ; ESP32-S3 requires external DAC via I2S
    -DESP32S3_EXTERNAL_DAC

board_build.flash_mode = qio
board_build.partitions = default.csv

; USB CDC support for ESP32-S3
build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; ESP32 with WROVER module (PSRAM)
; ============================================================
[env:esp32-wrover]
platform = espressif32
board = esp-wrover-kit
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue

board_build.flash_mode = dio
board_build.partitions = default.csv

; ============================================================
; ESP32 Debug build (with serial debug output)
; ============================================================
[env:esp32-debug]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_SERIAL=Serial

build_type = debug
monitor_filters = esp32_exception_decoder

; ============================================================
; ESP32 with WiFi UDP (wireless host connection)
; ============================================================
[env:esp32-wifi]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4
    ; Enable WiFi UDP communication
    -DUSE_WIFI_UDP
    ; WiFi credentials - CHANGE THESE!
    -DWIFI_SSID=\"your_ssid\"
    -DWIFI_PASSWORD=\"your_password\"
    ; MMDVMHost UDP settings
    -DMMDVM_HOST_ADDRESS=\"192.168.1.100\"
    -DMMDVM_HOST_PORT=3200
    -DMMDVM_LOCAL_PORT=3201
    ; WiFi TX power (2-20 dBm) - lower = less ADC interference
    -DWIFI_TX_POWER=15

board_build.flash_mode = dio
board_build.partitions = default.csv

; ============================================================
; ESP32 with PWM DAC (12-bit resolution, needs RC filter)
; ============================================================
[env:esp32-pwm]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4
    ; Use PWM-based DAC instead of built-in 8-bit DAC
    -DUSE_PWM_DAC

board_build.flash_mode = dio
board_build.partitions = default.csv

; ============================================================
; ESP32-S3 with PWM DAC (simpler than I2S external DAC)
; ============================================================
[env:esp32s3-pwm]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32S3
    -DESP32S3_GENERIC
    -DARM_MATH_CM4
    ; Use PWM DAC instead of I2S (simpler hardware)
    -DUSE_PWM_DAC

board_build.flash_mode = qio
board_build.partitions = default.csv

; USB CDC support for ESP32-S3
build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; ESP32 with WiFi + PWM DAC (full wireless, no external DAC)
; ============================================================
[env:esp32-wifi-pwm]
platform = espressif32
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32
    -DESP32_GENERIC
    -DARM_MATH_CM4
    ; PWM DAC for better resolution
    -DUSE_PWM_DAC
    ; WiFi UDP communication
    -DUSE_WIFI_UDP
    -DWIFI_SSID=\"your_ssid\"
    -DWIFI_PASSWORD=\"your_password\"
    -DMMDVM_HOST_ADDRESS=\"192.168.1.100\"
    -DMMDVM_HOST_PORT=3200
    -DMMDVM_LOCAL_PORT=3201
    -DWIFI_TX_POWER=12

board_build.flash_mode = dio
board_build.partitions = default.csv

; ============================================================
; ESP32-S3 with WiFi + PWM DAC (best wireless option)
; ============================================================
[env:esp32s3-wifi-pwm]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32S3
    -DESP32S3_GENERIC
    -DARM_MATH_CM4
    -DUSE_PWM_DAC
    -DUSE_WIFI_UDP
    -DWIFI_SSID=\"your_ssid\"
    -DWIFI_PASSWORD=\"your_password\"
    -DMMDVM_HOST_ADDRESS=\"192.168.1.100\"
    -DMMDVM_HOST_PORT=3200
    -DMMDVM_LOCAL_PORT=3201
    -DWIFI_TX_POWER=12

board_build.flash_mode = qio
board_build.partitions = default.csv

build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; ESP32-C3 - Single-core RISC-V, NO built-in DAC (use PWM)
; ============================================================
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

build_flags =
    ${env.build_flags}
    -DESP32C3
    -DESP32C3_GENERIC
    -DARM_MATH_CM4
    ; ESP32-C3 requires PWM or I2S DAC (default: PWM)
    -DUSE_PWM_DAC
    ; Reduced buffer sizes (smaller RAM)
    -DREDUCED_BUFFERS

board_build.flash_mode = dio
board_build.partitions = default.csv

; USB CDC support for ESP32-C3
build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; ESP32-C3 with WiFi + PWM DAC
; ============================================================
[env:esp32c3-wifi-pwm]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

build_flags =
    ${env.build_flags}
    -DESP32C3
    -DESP32C3_GENERIC
    -DARM_MATH_CM4
    -DUSE_PWM_DAC
    -DREDUCED_BUFFERS
    ; WiFi UDP communication
    -DUSE_WIFI_UDP
    -DWIFI_SSID=\"your_ssid\"
    -DWIFI_PASSWORD=\"your_password\"
    -DMMDVM_HOST_ADDRESS=\"192.168.1.100\"
    -DMMDVM_HOST_PORT=3200
    -DMMDVM_LOCAL_PORT=3201
    -DWIFI_TX_POWER=12

board_build.flash_mode = dio
board_build.partitions = default.csv

build_flags_extra =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

