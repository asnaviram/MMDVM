; ============================================================
; ESP32 Radio over IP (RoIP) Firmware
; Professional-grade RoIP client for ESP32 family
; ============================================================

[platformio]
default_envs = esp32s3-roip

[env]
framework = arduino
platform = espressif32
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv

; Common build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DROIP_VERSION=\"1.0.0\"
    ; Audio configuration
    -DAUDIO_SAMPLE_RATE=24000
    -DAUDIO_FRAME_SIZE_MS=20
    -DAUDIO_BUFFER_COUNT=10
    ; Opus codec settings (high quality)
    -DOPUS_BITRATE=32000
    -DOPUS_COMPLEXITY=10
    -DOPUS_APPLICATION=OPUS_APPLICATION_VOIP
    ; Network settings
    -DRTP_PAYLOAD_TYPE=96
    -DSIP_PORT=5060
    ; DSP features
    -DENABLE_AGC=1
    -DENABLE_NOISE_SUPPRESSION=1
    -DENABLE_VAD=1
    -DENABLE_AEC=1

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESP Async WebServer@^1.2.3
    ; Audio processing
    https://github.com/pschatzmann/arduino-audio-tools
    https://github.com/h2zero/NimBLE-Arduino
    ; Network
    https://github.com/ayushsharma82/WebSerial

; ============================================================
; ESP32 (Original) - Dual-core Xtensa, 2.4GHz WiFi
; ============================================================
[env:esp32-roip]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32_ORIGINAL
    -DHAS_DAC_BUILTIN=1

; ============================================================
; ESP32-S2 - Single-core Xtensa, 2.4GHz WiFi
; ============================================================
[env:esp32s2-roip]
board = esp32-s2-saola-1
board_build.mcu = esp32s2
board_build.f_cpu = 240000000L

build_flags =
    ${env.build_flags}
    -DESP32S2
    -DHAS_DAC_BUILTIN=1

; ============================================================
; ESP32-S3 - Dual-core Xtensa, 2.4GHz WiFi (RECOMMENDED)
; Best option: More RAM, USB OTG, WiFi 6 ready
; ============================================================
[env:esp32s3-roip]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi

build_flags =
    ${env.build_flags}
    -DESP32S3
    -DUSE_PWM_DAC=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1

; ============================================================
; ESP32-C3 - Single-core RISC-V, 2.4GHz WiFi, BLE 5.0
; ============================================================
[env:esp32c3-roip]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L

build_flags =
    ${env.build_flags}
    -DESP32C3
    -DUSE_PWM_DAC=1
    -DREDUCED_BUFFERS=1

; ============================================================
; ESP32-C6 - Single-core RISC-V, WiFi 6 (2.4/5GHz), BLE 5.3
; Supports 5GHz for better range and throughput
; ============================================================
[env:esp32c6-roip]
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L

build_flags =
    ${env.build_flags}
    -DESP32C6
    -DUSE_PWM_DAC=1
    -DWIFI6_SUPPORT=1
    -DWIFI_5GHZ_SUPPORT=1

; Note: Requires latest arduino-esp32 (3.0+)
; 5GHz provides better performance in congested 2.4GHz environments

; ============================================================
; Debug builds with verbose logging
; ============================================================
[env:esp32s3-roip-debug]
extends = env:esp32s3-roip
build_type = debug
build_flags =
    ${env:esp32s3-roip.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DROIP_DEBUG=1
    -DAUDIO_DEBUG=1
    -DNETWORK_DEBUG=1
monitor_filters = esp32_exception_decoder
