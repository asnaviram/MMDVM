# Opus library build configuration for ESP32
# This file configures how PlatformIO builds the Opus codec library

[opus]
build_flags =
    -DOPUS_BUILD
    -DVAR_ARRAYS
    -DUSE_ALLOCA
    -DHAVE_LRINTF
    -DHAVE_LRINT

# Include paths for Opus internal headers
build_unflags =

srcFilter =
    +<*>
    -<*demo*.c>
    -<*compare*.c>
    -<tests/>
    -<doc/>
