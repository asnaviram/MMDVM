apiVersion: v1
kind: Service
metadata:
  name: roip-server-service
  namespace: roip-production
  labels:
    app: roip-server
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: websocket
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: roip-server

---
apiVersion: v1
kind: Service
metadata:
  name: roip-server-sip
  namespace: roip-production
  labels:
    app: roip-server
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: sip
    port: 5060
    targetPort: 5060
    protocol: UDP
  - name: rtp-start
    port: 10000
    targetPort: 10000
    protocol: UDP
  - name: rtp-end
    port: 10100
    targetPort: 10100
    protocol: UDP
  selector:
    app: roip-server

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: roip-production
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: coturn-service
  namespace: roip-production
  labels:
    app: coturn
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: stun-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: stun-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
  - name: turns
    port: 5349
    targetPort: 5349
    protocol: TCP
  selector:
    app: coturn

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roip-server
  namespace: roip-production
