apiVersion: v1
kind: Secret
metadata:
  name: roip-secrets
  namespace: roip-production
type: Opaque
stringData:
  # IMPORTANT: Replace these values with actual secrets
  # In production, use external secret management (e.g., Sealed Secrets, Vault)

  DB_PASSWORD: "CHANGE_THIS_PASSWORD"
  JWT_SECRET: "CHANGE_THIS_SECRET_KEY"
  TURN_PASSWORD: "CHANGE_THIS_TURN_PASSWORD"

  # Optional: TLS certificates
  # tls.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # tls.key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----

---
# Example using Sealed Secrets (recommended for production)
# Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: roip-secrets
#   namespace: roip-production
# spec:
#   encryptedData:
#     DB_PASSWORD: AgA...encrypted...
#     JWT_SECRET: AgA...encrypted...
#     TURN_PASSWORD: AgA...encrypted...
