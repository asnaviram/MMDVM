---
# ESP32 RoIP System - Main Deployment Playbook
# Deploy complete RoIP infrastructure
#
# Usage:
#   ansible-playbook -i inventory/production playbook.yml
#   ansible-playbook -i inventory/staging playbook.yml --check
#   ansible-playbook -i inventory/production playbook.yml --tags roip-server

- name: Deploy RoIP Infrastructure
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install common packages
      package:
        name:
          - curl
          - wget
          - git
          - vim
          - htop
          - net-tools
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present

    - name: Set timezone
      timezone:
        name: "{{ system_timezone | default('UTC') }}"

    - name: Configure system hostname
      hostname:
        name: "{{ inventory_hostname }}"

  roles:
    - role: postgresql
      tags: ['database', 'postgresql']
      when: "'database' in group_names or 'all_in_one' in group_names"

    - role: coturn
      tags: ['coturn', 'turn', 'stun']
      when: "'turn_servers' in group_names or 'all_in_one' in group_names"

    - role: roip-server
      tags: ['roip-server', 'application']
      when: "'app_servers' in group_names or 'all_in_one' in group_names"

    - role: nginx
      tags: ['nginx', 'web', 'proxy']
      when: "'web_servers' in group_names or 'all_in_one' in group_names"

    - role: monitoring
      tags: ['monitoring', 'prometheus', 'grafana']
      when: "'monitoring' in group_names or deploy_monitoring | default(false)"

  post_tasks:
    - name: Ensure all services are started and enabled
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - roip-server
        - postgresql
        - coturn
        - nginx
      ignore_errors: yes

    - name: Run health checks
      uri:
        url: "http://localhost:8080/health"
        return_content: yes
      register: health_check
      until: health_check.status == 200
      retries: 5
      delay: 10
      when: "'app_servers' in group_names or 'all_in_one' in group_names"

    - name: Display deployment summary
      debug:
        msg:
          - "Deployment completed successfully!"
          - "Server: {{ inventory_hostname }}"
          - "IP: {{ ansible_default_ipv4.address }}"
          - "Services deployed: {{ ansible_play_role_names }}"
          - "Health check: {{ health_check.json.status | default('N/A') }}"
      when: health_check is defined
