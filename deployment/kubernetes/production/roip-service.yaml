apiVersion: v1
kind: Service
metadata:
  name: roip-api-service
  namespace: roip-production
  labels:
    app: roip-server
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: api
  selector:
    app: roip-server
---
apiVersion: v1
kind: Service
metadata:
  name: roip-websocket-service
  namespace: roip-production
  labels:
    app: roip-server
    component: websocket
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: websocket
  selector:
    app: roip-server
---
apiVersion: v1
kind: Service
metadata:
  name: roip-sip-service
  namespace: roip-production
  labels:
    app: roip-server
    component: sip
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - port: 5060
      targetPort: 5060
      protocol: UDP
      name: sip
    - port: 10000
      targetPort: 10000
      protocol: UDP
      name: rtp-start
  selector:
    app: roip-server
