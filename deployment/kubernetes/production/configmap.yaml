apiVersion: v1
kind: ConfigMap
metadata:
  name: roip-config
  namespace: roip-production
  labels:
    app: roip
    environment: production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Server configuration
  API_PORT: "8080"
  WEBSOCKET_PORT: "8081"
  SIP_PORT: "5060"

  # RTP configuration
  RTP_PORT_MIN: "10000"
  RTP_PORT_MAX: "10100"

  # Database configuration
  DB_TYPE: "postgresql"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "roip_production"
  DB_POOL_SIZE: "20"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # TURN server configuration
  TURN_SERVER: "coturn-service"
  TURN_PORT: "3478"

  # Performance
  CLUSTER_MODE: "true"
  CLUSTER_WORKERS: "4"

  # Monitoring
  ENABLE_METRICS: "true"
  METRICS_PORT: "9090"

  # Security
  ENABLE_RATE_LIMIT: "true"
