apiVersion: v1
kind: Secret
metadata:
  name: roip-secrets
  namespace: roip-production
  labels:
    app: roip
    environment: production
type: Opaque
stringData:
  # Database credentials
  DB_USER: "roip_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT secret
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"

  # TURN credentials
  TURN_USERNAME: "roip"
  TURN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Admin credentials
  ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
