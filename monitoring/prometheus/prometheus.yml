# Prometheus Configuration for ESP32 RoIP System
# This configuration monitors RoIP server, database, and infrastructure

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'roip-production'
    environment: 'production'

# Load alerting rules
rule_files:
  - 'alerts.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # RoIP Server Application Metrics
  - job_name: 'roip-server'
    scrape_interval: 10s
    static_configs:
      - targets: ['roip-server:9100']
        labels:
          service: 'roip-server'
          component: 'application'
    metric_relabel_configs:
      # Drop high cardinality metrics if needed
      - source_labels: [__name__]
        regex: 'go_.*'
        action: drop

  # Node Exporter for System Metrics (CPU, Memory, Disk, Network)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'system'

  # PostgreSQL Database Metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgresql'

  # Redis Cache Metrics (if using Redis)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          component: 'redis'

  # RTP Metrics - Custom exporter for audio quality
  - job_name: 'rtp-metrics'
    scrape_interval: 5s  # More frequent for real-time audio monitoring
    static_configs:
      - targets: ['roip-server:9101']
        labels:
          service: 'roip-server'
          component: 'rtp'

  # SIP Metrics - Custom exporter for SIP signaling
  - job_name: 'sip-metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['roip-server:9102']
        labels:
          service: 'roip-server'
          component: 'sip'

  # Business Metrics - Active devices, calls, routes
  - job_name: 'business-metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['roip-server:9103']
        labels:
          service: 'roip-server'
          component: 'business'

  # Cadvisor for Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'infrastructure'
          component: 'containers'

  # Nginx/Reverse Proxy Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'infrastructure'
          component: 'proxy'

  # Blackbox Exporter for Service Health Checks
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://roip-server:8080/health
          - http://roip-server:8080/api/v1/status
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox Exporter for SIP/UDP Endpoints
  - job_name: 'blackbox-udp'
    metrics_path: /probe
    params:
      module: [udp_connect]
    static_configs:
      - targets:
          - roip-server:5060  # SIP port
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention.time: 30d
    retention.size: 50GB

# Remote write configuration for long-term storage (optional)
