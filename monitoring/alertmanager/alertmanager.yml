# Alertmanager Configuration
# Handles alert routing, grouping, and notification

global:
  resolve_timeout: 5m
  smtp_from: 'alerts@roip.local'
  smtp_smarthost: 'localhost:25'
  smtp_require_tls: false

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for organizing alerts
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      continue: true

    # Infrastructure alerts
    - match:
        category: infrastructure
      receiver: 'infrastructure-team'
      group_wait: 30s
      repeat_interval: 1h

    # Database alerts
    - match:
        category: database
      receiver: 'database-team'
      group_wait: 30s
      repeat_interval: 1h

    # Security alerts
    - match:
        category: security
      receiver: 'security-team'
      group_wait: 10s
      repeat_interval: 30m

    # Audio quality alerts
    - match:
        category: audio_quality
      receiver: 'operations-team'
      group_wait: 15s
      repeat_interval: 30m

    # SIP alerts
    - match:
        category: sip
      receiver: 'voip-team'
      group_wait: 30s
      repeat_interval: 1h

# Inhibition rules to mute certain alerts
inhibit_rules:
  # If service is down, don't alert on high latency
  - source_match:
      severity: 'critical'
      alertname: 'RoIPServerDown'
    target_match:
      severity: 'warning'
    equal: ['instance']

  # If database is down, don't alert on connection issues
  - source_match:
      severity: 'critical'
      alertname: 'DatabaseDown'
    target_match:
      category: 'database'
    equal: ['instance']

# Receiver configurations
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:9099/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    # Email notification
    email_configs:
      - to: 'oncall@roip.local'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
        send_resolved: true

    # Webhook for integration (e.g., PagerDuty, Slack)
    webhook_configs:
      - url: 'http://localhost:9099/critical'
        send_resolved: true

    # Example: Slack integration (uncomment and configure)
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#alerts-critical'
    #     title: '[CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    #     send_resolved: true

  - name: 'infrastructure-team'
    email_configs:
      - to: 'infrastructure@roip.local'
        headers:
          Subject: '[Infrastructure] {{ .GroupLabels.alertname }}'
        send_resolved: true

  - name: 'database-team'
    email_configs:
      - to: 'database@roip.local'
        headers:
          Subject: '[Database] {{ .GroupLabels.alertname }}'
        send_resolved: true

  - name: 'security-team'
    email_configs:
      - to: 'security@roip.local'
        headers:
          Subject: '[Security Alert] {{ .GroupLabels.alertname }}'
        send_resolved: true
    webhook_configs:
      - url: 'http://localhost:9099/security'
        send_resolved: true

  - name: 'operations-team'
    email_configs:
      - to: 'operations@roip.local'
        headers:
          Subject: '[Operations] {{ .GroupLabels.alertname }}'
        send_resolved: true

  - name: 'voip-team'
    email_configs:
      - to: 'voip@roip.local'
        headers:
          Subject: '[VoIP/SIP] {{ .GroupLabels.alertname }}'
        send_resolved: true
