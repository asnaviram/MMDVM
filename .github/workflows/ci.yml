name: Continuous Integration

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_ENV: test
  CI: true

jobs:
  # ============================================================
  # Code Quality & Linting
  # ============================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run ESLint
        working-directory: roip-server
        run: |
          npm run lint -- --format=json --output-file=eslint-report.json || true
          npm run lint

      - name: Check code formatting
        working-directory: roip-server
        run: |
          npx prettier --check "src/**/*.js" "test/**/*.js" || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: roip-server/eslint-report.json
          retention-days: 7

  # ============================================================
  # Security Scanning
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run npm audit
        working-directory: roip-server
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit --audit-level=moderate || echo "⚠️ Security vulnerabilities found"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: roip-server/npm-audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        working-directory: roip-server
        run: |
          # Fail CI if critical/high vulnerabilities found
          npm audit --audit-level=high

  # ============================================================
  # Unit Tests - Multiple Node.js Versions
  # ============================================================
  test-unit:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: roip-server
        run: |
          npm test -- \
            --coverage \
            --coverageReporters=json \
            --coverageReporters=lcov \
            --coverageReporters=text \
            --coverageReporters=cobertura \
            --testPathIgnorePatterns=integration \
            --testPathIgnorePatterns=e2e
        env:
          NODE_VERSION: ${{ matrix.node-version }}

      - name: Generate coverage summary
        if: matrix.node-version == '20.x'
        working-directory: roip-server
        run: |
          echo "# Test Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "**Node Version:** ${{ matrix.node-version }}" >> coverage-summary.md
          echo "" >> coverage-summary.md
          if [ -f coverage/coverage-summary.txt ]; then
            echo "\`\`\`" >> coverage-summary.md
            cat coverage/coverage-summary.txt >> coverage-summary.md
            echo "\`\`\`" >> coverage-summary.md
          fi

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./roip-server/coverage/lcov.info
          flags: unit-tests
          name: unit-tests-node-${{ matrix.node-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-node-${{ matrix.node-version }}
          path: |
            roip-server/coverage/
            roip-server/coverage-summary.md
          retention-days: 7

  # ============================================================
  # Integration Tests
  # ============================================================
  test-integration:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
        database: ['sqlite', 'postgresql']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roip_test
          POSTGRES_USER: roip_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run integration tests
        working-directory: roip-server
        run: |
          npm test -- \
            --testPathPattern=integration \
            --coverage \
            --coverageReporters=json \
            --coverageReporters=lcov
        env:
          NODE_VERSION: ${{ matrix.node-version }}
          DB_TYPE: ${{ matrix.database }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: roip_test
          DB_USER: roip_test
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x' && matrix.database == 'postgresql'
        uses: codecov/codecov-action@v4
        with:
          files: ./roip-server/coverage/lcov.info
          flags: integration-tests
          name: integration-tests-node-${{ matrix.node-version }}-${{ matrix.database }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-node-${{ matrix.node-version }}-${{ matrix.database }}
          path: roip-server/coverage/
          retention-days: 7

  # ============================================================
  # End-to-End Tests
  # ============================================================
  test-e2e:
    name: E2E Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roip_test
          POSTGRES_USER: roip_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install server dependencies
        working-directory: roip-server
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: test/e2e
        run: npm ci

      - name: Start server in background
        working-directory: roip-server
        run: |
          npm start &
          echo $! > /tmp/server.pid
          sleep 10
        env:
          NODE_ENV: test
          DB_TYPE: postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: roip_test
          DB_USER: roip_test
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci
          API_PORT: 8080
          SIP_PORT: 5060

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

      - name: Run E2E tests
        working-directory: test/e2e
        run: npm test
        env:
          SERVER_URL: http://localhost:8080
          SIP_SERVER: localhost:5060

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: test/e2e/test-results/
          retention-days: 7

  # ============================================================
  # Build Firmware for All ESP32 Variants
  # ============================================================
  build-firmware:
    name: Build Firmware - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32
          - esp32s2
          - esp32s3
          - esp32-wrover
          - esp32c3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-${{ matrix.environment }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}-
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build firmware - ${{ matrix.environment }}
        run: |
          echo "Building firmware for ${{ matrix.environment }}..."
          pio run -e ${{ matrix.environment }}

      - name: Get firmware size
        id: firmware_size
        run: |
          if [ -f .pio/build/${{ matrix.environment }}/firmware.bin ]; then
            SIZE=$(ls -lh .pio/build/${{ matrix.environment }}/firmware.bin | awk '{print $5}')
            echo "firmware_size=$SIZE" >> $GITHUB_OUTPUT
            echo "Firmware size for ${{ matrix.environment }}: $SIZE"
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
          retention-days: 30

  # ============================================================
  # Build Summary & Status Check
  # ============================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test-unit, test-integration, test-e2e, build-firmware]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate CI summary
        run: |
          echo "# Continuous Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          # Lint
          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "| 🔍 Lint & Code Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔍 Lint & Code Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Security
          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "| 🔒 Security Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔒 Security Audit | ⚠️  Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Unit Tests
          if [ "${{ needs.test-unit.result }}" == "success" ]; then
            echo "| 🧪 Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Integration Tests
          if [ "${{ needs.test-integration.result }}" == "success" ]; then
            echo "| 🔗 Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔗 Integration Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E Tests
          if [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "| 🚀 E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🚀 E2E Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Firmware Build
          if [ "${{ needs.build-firmware.result }}" == "success" ]; then
            echo "| 📦 Firmware Build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📦 Firmware Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 Test Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Versions:** 18.x, 20.x, 22.x" >> $GITHUB_STEP_SUMMARY
          echo "- **Databases:** SQLite, PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **ESP32 Variants:** esp32, esp32s2, esp32s3, esp32-wrover, esp32c3" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📈 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Code coverage reports (uploaded to Codecov)" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint analysis results" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit reports" >> $GITHUB_STEP_SUMMARY
          echo "- Firmware binaries for all ESP32 variants" >> $GITHUB_STEP_SUMMARY
          echo "- E2E test results" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ] || \
             [ "${{ needs.build-firmware.result }}" != "success" ]; then
            echo "❌ CI pipeline failed - one or more jobs did not succeed"
            exit 1
          fi

          if [ "${{ needs.security.result }}" != "success" ]; then
            echo "⚠️  Security audit found issues - review required"
            echo "✅ All other CI checks passed"
            exit 0
          fi

          echo "✅ All CI checks passed successfully!"
