name: Server Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'roip-server/**'
      - 'test/**'
      - '.github/workflows/server-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'roip-server/**'
      - 'test/**'
      - '.github/workflows/server-test.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  NODE_ENV: test

jobs:
  # ============================================================
  # Linting and code quality
  # ============================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run ESLint
        working-directory: roip-server
        run: |
          npm run lint -- --format=json --output-file=eslint-report.json || true
          npm run lint

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report-${{ github.sha }}
          path: roip-server/eslint-report.json
          retention-days: 7

  # ============================================================
  # Unit tests with coverage
  # ============================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: roip-server
        run: |
          npm test -- --coverage --coverageReporters=json --coverageReporters=lcov --coverageReporters=text
        env:
          CI: true

      - name: Generate coverage report
        working-directory: roip-server
        run: |
          echo "# Test Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md
          cat coverage/coverage-summary.txt 2>/dev/null || echo "Coverage summary not available" >> coverage-summary.md
          echo "\`\`\`" >> coverage-summary.md

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./roip-server/coverage/lcov.info
          flags: server-unit
          name: server-unit-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.sha }}
          path: |
            roip-server/coverage/
            roip-server/coverage-summary.md
          retention-days: 7

  # ============================================================
  # Integration tests
  # ============================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roip_test
          POSTGRES_USER: roip_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install dependencies
        working-directory: roip-server
        run: npm ci

      - name: Run integration tests
        working-directory: roip-server
        run: |
          npm test -- --testPathPattern=integration --coverage --coverageReporters=json --coverageReporters=lcov
        env:
          CI: true
          DB_TYPE: postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: roip_test
          DB_USER: roip_test
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./roip-server/coverage/lcov.info
          flags: server-integration
          name: server-integration-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.sha }}
          path: roip-server/coverage/
          retention-days: 7

  # ============================================================
  # End-to-end tests
  # ============================================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: roip_test
          POSTGRES_USER: roip_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: roip-server/package-lock.json

      - name: Install server dependencies
        working-directory: roip-server
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: test/e2e
        run: npm ci

      - name: Start server in background
        working-directory: roip-server
        run: |
          npm start &
          echo $! > server.pid
          sleep 10
        env:
          NODE_ENV: test
          DB_TYPE: postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: roip_test
          DB_USER: roip_test
          DB_PASSWORD: test_password
          JWT_SECRET: test-secret-key
          API_PORT: 8080
          SIP_PORT: 5060

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'

      - name: Run E2E tests
        working-directory: test/e2e
        run: npm test
        env:
          SERVER_URL: http://localhost:8080
          SIP_SERVER: localhost:5060

      - name: Stop server
        if: always()
        working-directory: roip-server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.sha }}
          path: test/e2e/test-results/
          retention-days: 7

  # ============================================================
  # Test summary and status check
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration, test-e2e]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate test summary
        run: |
          echo "# Server Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Lint status
          if [ "${{ needs.lint.result }}" == "success" ]; then
            echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lint | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Unit test status
          if [ "${{ needs.test-unit.result }}" == "success" ]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Integration test status
          if [ "${{ needs.test-integration.result }}" == "success" ]; then
            echo "| Integration Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Integration Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E test status
          if [ "${{ needs.test-e2e.result }}" == "success" ]; then
            echo "| E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| E2E Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded to Codecov" >> $GITHUB_STEP_SUMMARY

      - name: Check test status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test-unit.result }}" != "success" ] || \
             [ "${{ needs.test-integration.result }}" != "success" ] || \
             [ "${{ needs.test-e2e.result }}" != "success" ]; then
            echo "❌ One or more test suites failed"
            exit 1
          fi
          echo "✅ All tests passed"
