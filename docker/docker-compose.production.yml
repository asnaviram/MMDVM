version: '3.8'

# Production Docker Compose Configuration
# For deployment instructions, see docs/PRODUCTION_DEPLOYMENT.md

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: roip-postgres-prod
    hostname: postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"  # Only expose to localhost
    environment:
      POSTGRES_DB: ${DB_NAME:-roip_production}
      POSTGRES_USER: ${DB_USER:-roip_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - roip-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-roip_user} -d ${DB_NAME:-roip_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # RoIP Server
  roip-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NODE_ENV: production
    image: roip-server:${APP_VERSION:-latest}
    container_name: roip-server-prod
    hostname: roip-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      coturn:
        condition: service_healthy
    environment:
      # Environment
      NODE_ENV: production

      # Server configuration
      SERVER_HOST: 0.0.0.0
      SIP_PORT: 5060
      SIP_TRANSPORT: ${SIP_TRANSPORT:-udp}
      SIP_REALM: ${SIP_REALM:-roip.local}
      RTP_PORT_MIN: 10000
      RTP_PORT_MAX: 10100

      # API configuration
      API_PORT: 8080
      WEBSOCKET_PORT: 8081
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://roip.example.com}

      # Database configuration
      DB_TYPE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-roip_production}
      DB_USER: ${DB_USER:-roip_user}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_SSL: ${DB_SSL:-false}

      # Authentication
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      # TURN/STUN server
      TURN_SERVER: ${TURN_SERVER:-coturn}
      TURN_PORT: 3478
      TURN_USERNAME: ${TURN_USERNAME:?TURN username required}
      TURN_PASSWORD: ${TURN_PASSWORD:?TURN password required}

      # Network configuration
      ENABLE_STUN: ${ENABLE_STUN:-true}
      ENABLE_TURN: ${ENABLE_TURN:-true}
      NAT_DETECTION: ${NAT_DETECTION:-true}

      # Performance
      CLUSTER_MODE: ${CLUSTER_MODE:-true}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-4}

      # Monitoring
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: 9090
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
      - "127.0.0.1:8080:8080"  # API only on localhost (nginx proxy)
      - "127.0.0.1:8081:8081"  # WebSocket only on localhost
      - "127.0.0.1:9090:9090"  # Metrics only on localhost
    volumes:
      - roip_data:/app/data
      - roip_logs:/app/logs
      - roip_recordings:/app/recordings
      - ./config:/app/config:ro
    networks:
      - roip-backend
      - roip-frontend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:mode=1777,size=512M

  # Coturn TURN/STUN Server
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: roip-coturn-prod
    hostname: coturn
    restart: always
    network_mode: host  # Required for proper NAT detection
    environment:
      DETECT_EXTERNAL_IP: "yes"
      DETECT_RELAY_IP: "yes"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
      - coturn_data:/var/lib/coturn
    healthcheck:
      test: ["CMD", "nc", "-zvu", "localhost", "3478"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: roip-nginx-prod
    hostname: nginx
    restart: always
    depends_on:
      - roip-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    networks:
      - roip-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: roip-prometheus-prod
    hostname: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9091:9090"  # Only on localhost
    volumes:
      - ../deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../deployment/monitoring/alert-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - roip-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: roip-grafana-prod
    hostname: grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"  # Only on localhost (nginx proxy)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Grafana admin password required}
      GF_INSTALL_PLUGINS: ${GRAFANA_PLUGINS:-}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../deployment/monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../deployment/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - roip-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/roip/postgres
  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/backups/roip/postgres
  roip_data:
    driver: local
  roip_logs:
    driver: local
  roip_recordings:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/roip/recordings
  coturn_data:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  roip-backend:
    driver: bridge
    internal: true  # No external access
    driver_opts:
      com.docker.network.driver.mtu: 1500
  roip-frontend:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
      com.docker.network.bridge.name: roip0
