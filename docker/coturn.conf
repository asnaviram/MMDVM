# Coturn TURN/STUN Server Configuration
# For use with ESP32 RoIP System

# ===============================================
# Basic Configuration
# ===============================================

# Log level
log-file=/var/log/coturn/turnserver.log
new-log-file-period=monthly
log-binding=yes

# Process IDs
pidfile=/var/run/coturn.pid

# ===============================================
# Network Configuration
# ===============================================

# Listening IP addresses
# Listen on all interfaces
listening-ip=0.0.0.0
listening-ipv6=::

# Listening ports
listening-port=3478

# Alternative listening ports
alt-listening-port=3479
alt-tls-listening-port=5350

# Relay IP addresses (for multi-homed systems)
# Leave commented to use listening-ip automatically
relay-ip=0.0.0.0

# Relay IPv6
relay-ipv6=::

# External IP (for NAT detection and relay)
# If behind NAT, set to external public IP
# external-ip=YOUR.PUBLIC.IP/YOUR.INTERNAL.IP
# external-ip=YOUR.PUBLIC.IPV6/YOUR.INTERNAL.IPV6

# ===============================================
# TURN Protocol Configuration
# ===============================================

# REALM - authentication domain
realm=roip.local

# Username and password for TURN authentication
# Format: username:password
# Can be specified multiple times
user=roip:roip_turn_password

# Generate long-term credentials (recommended)
# Must be combined with 'user' option or external auth
# long-term-credential=yes

# ===============================================
# STUN Configuration
# ===============================================

# Enable STUN functionality
stun-only=no

# STUN cache time (seconds)
stun-cache-time=600

# Fingerprint in STUN (RFC 5389)
fingerprint=yes

# ===============================================
# Performance & Resource Configuration
# ===============================================

# Maximum number of bps (bytes per second) for all connections
# 0 = unlimited (default)
bps-capacity=0

# Maximum bandwidth for TURN session (bps)
# 0 = unlimited (default)
max-bps=0

# Check source IP
check-source-ip=yes

# Thread pool size
thread-pool-size=24

# Keep-alive timeout (seconds)
keep-alive-timeout=300

# Connection timeout (seconds)
connection-timeout=120

# ===============================================
# Relay Configuration
# ===============================================

# UDP relay
relay-ip=0.0.0.0

# TCP relay
relay-ip-only=no

# Allowed peer IPs (empty = allow all)
# allowed-peer-ip=127.0.0.1
# allowed-peer-ip=192.168.0.0/16

# Denied peer IPs (empty = deny none)
# denied-peer-ip=0.0.0.0/0

# ===============================================
# Security Configuration
# ===============================================

# Require authentication for STUN
# secure-stun=yes (default is no)

# Enable permissions
permit-same-ip=no

# Prevent simultaneous logins
no-multicast-peers=yes

# Enforce authentication
require-turn-auth=yes

# Keep-alive mode
keep-alive-and-die=yes

# ===============================================
# Access Control
# ===============================================

# Enable TURN
# (This is usually recommended)
enable-turn=yes

# Enable STUN
# (This is usually recommended)
enable-stun=yes

# Disable HTTPS (only HTTP/plain)
# insecure=yes

# ===============================================
# Verbose Output (for debugging)
# ===============================================

# Verbose mode (comment out for production)
# verbose

# ===============================================
# IPv6 Configuration (Optional)
# ===============================================

# Enable IPv6
ipv6=yes

# Listening IPv6 addresses
listening-ipv6=::

# Relay IPv6
relay-ipv6=::

# ===============================================
# Additional Options
# ===============================================

# Server name
server-name="ESP32-RoIP-TURN"

# Statistics
stats=yes

# Prometheus metrics (if supported)
# prometheus-url=http://prometheus:9090/metrics

# ===============================================
# Database Configuration (Optional)
# ===============================================

# SQLite database for user credentials
# db=/var/lib/coturn/turndb

# PostgreSQL connection string (alternative to SQLite)
# psql_connect_string="host=postgres dbname=roip user=roip password=roip_secure_password"

# ===============================================
# Mobility and Load Balancing
# ===============================================

# Cluster name (for load balancing)
# cluster-name="roip-cluster"

# Redis configuration (for distributed deployments)
# redis-ip=redis
# redis-port=6379
# redis-db=0

# ===============================================
# OAuth Configuration (Optional)
# ===============================================

# Enable OAuth
# oauth=yes

# OAuth server
# oauth-server-auth-uri=http://oauth-server/auth

# ===============================================
# NAT Behavior Discovery (STUN)
# ===============================================

# Check NAT behavior
check-nat-behavior=yes

# Response to binding request
response-binding-address=yes
