# ESP32 RoIP Server - Production Configuration
# Optimized for high-performance production deployment
# All settings can be overridden via environment variables

server:
  name: "ESP32 RoIP Server"
  version: "1.0.0"

  # Server binding
  host: "0.0.0.0"  # Listen on all interfaces

  # SIP settings
  sip:
    port: 5060
    transport: "udp"
    realm: "roip.production"
    user_agent: "ESP32-RoIP-Server/1.0"

  # RTP settings
  rtp:
    port_min: 10000
    port_max: 10100
    payload_type: 96

  # Web API settings
  api:
    port: 8080
    enable_cors: true
    cors_origins: "*"  # In production, specify allowed origins

  # WebSocket settings
  websocket:
    port: 8081
    ping_interval: 30000  # ms

# Performance optimization settings
performance:
  # Cluster mode for multi-core utilization
  cluster:
    enabled: true
    workers: 4  # Number of worker processes (set to CPU core count)

  # HTTP keep-alive settings
  keepAlive:
    enabled: true
    timeout: 65000  # ms (65 seconds)
    headersTimeout: 66000  # ms (66 seconds)

  # Compression settings
  compression:
    enabled: true
    level: 6  # Compression level (1-9, 6 is balanced)
    threshold: 1024  # Only compress responses larger than 1KB

  # API response caching
  cache:
    enabled: true
    defaultTTL: 30  # Default cache TTL in seconds
    checkPeriod: 120  # Cache cleanup check period in seconds
    logStats: true  # Log cache statistics

  # Event loop monitoring
  eventLoopMonitoring:
    enabled: true
    lagThreshold: 100  # ms - warn if event loop lags more than this
    checkInterval: 5000  # ms - check interval

  # Memory monitoring
  memoryMonitoring:
    enabled: true
    threshold: 0.9  # Warn when heap usage exceeds 90%
    checkInterval: 60000  # ms - check every minute

# Database configuration
database:
  type: "sqlite"  # sqlite or postgresql

  # SQLite settings
  sqlite:
    file: "./data/roip.db"

  # PostgreSQL settings (for production scale)
  postgresql:
    enabled: false
    host: "localhost"
    port: 5432
    database: "roip"
    username: "roip"
    password: "changeme"
    pool_size: 20  # Increased for production

# Authentication settings
auth:
  # JWT tokens for API
  jwt_secret: "CHANGE-THIS-SECRET-IN-PRODUCTION"  # Must be changed!
  jwt_expiry: "1h"

  # SIP digest authentication
  sip_auth_enabled: true

  # Admin user
  admin:
    username: "admin"
    password: "admin"  # CHANGE THIS!

# STUN/TURN settings for NAT traversal
nat_traversal:
  # STUN server
  stun:
    enabled: true
    servers:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"

  # TURN relay server
  turn:
    enabled: false
    host: "0.0.0.0"
    port: 3478
    realm: "roip.production"
    secret: "CHANGE-THIS-TURN-SECRET"

# Audio/Codec settings
audio:
  # Supported codecs (in preference order)
  codecs:
    - name: "opus"
      payload_type: 96
      sample_rate: 24000
      channels: 1
      bitrate: 32000

    - name: "pcmu"  # G.711 mu-law
      payload_type: 0
      sample_rate: 8000
      channels: 1

  # Jitter buffer settings
  jitter_buffer:
    min_delay_ms: 20
    max_delay_ms: 200
    target_delay_ms: 50

# Call routing and mixing
routing:
  # Maximum simultaneous calls (optimized for production)
  max_concurrent_calls: 1000

  # Call timeout (seconds)
  call_timeout: 3600  # 1 hour

  # Enable audio mixing/conferencing
  enable_mixing: true

  # Maximum participants in a conference
  max_conference_size: 20

# Recording settings
recording:
  enabled: true
  path: "./recordings"
  format: "wav"

  # Auto-delete after N days (0 = keep forever)
  retention_days: 30

# Logging configuration
logging:
  level: "info"  # error, warn, info, debug (use info or warn in production)

  # Console logging
  console:
    enabled: true
    colorize: false  # Disable colors in production logs

  # File logging
  file:
    enabled: true
    path: "./logs"
    filename: "roip-server.log"
    max_size: "50m"  # Larger log files for production
    max_files: 10  # Keep more historical logs

  # SIP message logging (disabled in production for performance)
  sip_messages: false

  # RTP packet logging (disabled in production)
  rtp_packets: false

# Quality of Service
qos:
  # DSCP marking for network prioritization
  dscp_enabled: true
  dscp_value: 46  # EF (Expedited Forwarding)

# Security settings
security:
  # Rate limiting
  rate_limit:
    enabled: true
    window_ms: 60000
    max_requests: 200  # Increased for production

  # HTTPS/TLS settings
  https:
    enabled: false  # Enable in production with valid certificates
    cert_file: "./certs/server.crt"
    key_file: "./certs/server.key"

  # SRTP (secure RTP)
  srtp:
    enabled: false  # Enable for secure RTP
    crypto_suites:
      - "AES_CM_128_HMAC_SHA1_80"

# TLS configuration
tls:
  enabled: false  # Enable in production
  cert: "./certs/server.crt"
  key: "./certs/server.key"
  ca: "./certs/ca.crt"
  redirect_http: true  # Redirect HTTP to HTTPS
  http_redirect_port: 8079

# Device management
devices:
  # Auto-register devices
  auto_registration: true

  # Registration expiry (seconds)
  registration_expiry: 3600

  # Maximum devices per user
  max_devices_per_user: 50  # Increased for production

# Monitoring and health
monitoring:
  # Metrics endpoint
  metrics_enabled: true
  metrics_port: 9090

  # Health check endpoint
  health_check_enabled: true

  # Statistics update interval (seconds)
  stats_interval: 10  # More frequent in production

# Features
features:
  # DTMF relay
  dtmf_relay: true

  # Voice activity detection
  vad: true

  # Comfort noise generation
  cng: true

  # Forward error correction
  fec: true

# Rate limiting configuration
rate_limiting:
  window_ms: 60000  # 1 minute window
  max_requests: 200  # Max 200 requests per minute
  auth_max_requests: 10  # Max 10 auth attempts per 15 minutes
  device_max_requests: 60  # Max 60 device operations per minute
  call_max_requests: 20  # Max 20 call operations per second
