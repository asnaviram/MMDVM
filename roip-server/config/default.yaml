# ESP32 RoIP Server Configuration
# Professional Radio over IP server configuration
# All settings can be overridden via environment variables

server:
  name: "ESP32 RoIP Server"
  version: "1.0.0"

  # Server binding
  host: "0.0.0.0"  # Listen on all interfaces

  # SIP settings
  sip:
    port: 5060
    transport: "udp"  # udp or tcp
    realm: "roip.local"
    user_agent: "ESP32-RoIP-Server/1.0"

  # RTP settings
  rtp:
    port_min: 10000
    port_max: 10100
    payload_type: 96  # Opus codec

  # Web API settings
  api:
    port: 8080
    enable_cors: true
    cors_origins: "*"  # In production, specify allowed origins

  # WebSocket settings
  websocket:
    port: 8081
    ping_interval: 30000  # ms

# Database configuration
database:
  type: "sqlite"  # sqlite or postgresql

  # SQLite settings (for lightweight deployment)
  sqlite:
    file: "./data/roip.db"

  # PostgreSQL settings (for production)
  postgresql:
    enabled: false
    host: "localhost"
    port: 5432
    database: "roip"
    username: "roip"
    # SECURITY: Use environment variable DB_PASSWORD in production
    # Never commit actual passwords to version control
    # Generate secure password: openssl rand -base64 24
    password: "CHANGE-THIS-PASSWORD-IMMEDIATELY"  # MUST be changed!
    pool_size: 10

# Authentication settings
auth:
  # JWT tokens for API (REQUIRED in production!)
  # Generate a secure secret with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
  # This default value will be REJECTED by the auth manager for security
  jwt_secret: "INSECURE-DEFAULT-VALUE-REPLACE-IMMEDIATELY"  # MUST be changed!
  jwt_expiry: "1h"

  # SIP digest authentication
  sip_auth_enabled: true

  # Admin user (for web interface)
  # SECURITY WARNING: Change these credentials immediately in production!
  admin:
    username: "admin"
    password: "CHANGE-THIS-PASSWORD-IMMEDIATELY"  # CHANGE THIS!

# STUN/TURN settings for NAT traversal
nat_traversal:
  # STUN server for NAT detection
  stun:
    enabled: true
    servers:
      - "stun:stun.l.google.com:19302"
      - "stun:stun1.l.google.com:19302"

  # TURN relay server (for CGNAT clients)
  turn:
    enabled: false  # Enable if you want to run TURN relay
    host: "0.0.0.0"
    port: 3478
    realm: "roip.local"
    # Shared secret for TURN authentication
    secret: "CHANGE-THIS-TURN-SECRET"

# Audio/Codec settings
audio:
  # Supported codecs (in preference order)
  codecs:
    - name: "opus"
      payload_type: 96
      sample_rate: 24000
      channels: 1
      bitrate: 32000

    - name: "pcmu"  # G.711 mu-law
      payload_type: 0
      sample_rate: 8000
      channels: 1

  # Jitter buffer settings
  jitter_buffer:
    min_delay_ms: 20
    max_delay_ms: 200
    target_delay_ms: 50

# Call routing and mixing
routing:
  # Maximum simultaneous calls
  max_concurrent_calls: 100

  # Call timeout (seconds)
  call_timeout: 3600  # 1 hour

  # Enable audio mixing/conferencing
  enable_mixing: true

  # Maximum participants in a conference
  max_conference_size: 10

# Recording settings
recording:
  enabled: false
  path: "./recordings"
  format: "wav"  # wav or opus

  # Auto-delete after N days (0 = keep forever)
  retention_days: 30

# Logging configuration
logging:
  level: "info"  # error, warn, info, debug, trace

  # Console logging
  console:
    enabled: true
    colorize: true

  # File logging
  file:
    enabled: true
    path: "./logs"
    filename: "roip-server.log"
    max_size: "10m"
    max_files: 5

  # SIP message logging (for debugging)
  sip_messages: false

  # RTP packet logging (very verbose!)
  rtp_packets: false

# Quality of Service
qos:
  # DSCP marking for network prioritization
  dscp_enabled: false
  dscp_value: 46  # EF (Expedited Forwarding)

# TLS/SSL Configuration
tls:
  # Enable HTTPS for API and WebSocket
  enabled: false

  # Certificate files (Let's Encrypt or custom)
  cert: "/etc/letsencrypt/live/roip.example.com/fullchain.pem"
  key: "/etc/letsencrypt/live/roip.example.com/privkey.pem"
  ca: null  # Optional: CA certificate bundle

  # HTTP to HTTPS redirect
  redirect_http: true
  http_redirect_port: 8079

  # TLS protocol versions
  min_version: "TLSv1.2"
  max_version: "TLSv1.3"

  # Cipher suites (modern, secure ciphers)
  ciphers:
    - "TLS_AES_128_GCM_SHA256"
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_CHACHA20_POLY1305_SHA256"
    - "ECDHE-RSA-AES128-GCM-SHA256"
    - "ECDHE-RSA-AES256-GCM-SHA384"

  # Client certificate authentication (optional)
  client_cert_auth:
    enabled: false
    required: false
    ca_file: null

# Security settings
security:
  # Rate limiting (requests per minute)
  rate_limit:
    enabled: true
    window_ms: 60000
    max_requests: 100

  # SRTP (Secure RTP) for encrypted media
  srtp:
    enabled: false
    crypto_suites:
      - "AES_CM_128_HMAC_SHA1_80"
      - "AES_CM_128_HMAC_SHA1_32"
      - "AEAD_AES_256_GCM"
      - "AEAD_AES_128_GCM"

    # Key derivation
    key_derivation_rate: 0  # 0 = no re-keying

  # Security headers (enforced by server)
  headers:
    hsts_enabled: true
    hsts_max_age: 31536000
    hsts_include_subdomains: true
    hsts_preload: true
    frame_options: "DENY"
    content_type_options: "nosniff"
    xss_protection: "1; mode=block"

# Device management
devices:
  # Auto-register devices
  auto_registration: true

  # Registration expiry (seconds)
  registration_expiry: 3600

  # Maximum devices per user
  max_devices_per_user: 10

# Monitoring and health
monitoring:
  # Metrics endpoint
  metrics_enabled: true
  metrics_port: 9090

  # Health check endpoint
  health_check_enabled: true

  # Statistics update interval (seconds)
  stats_interval: 5

# Features
features:
  # DTMF relay
  dtmf_relay: true

  # Voice activity detection
  vad: true

  # Comfort noise generation
  cng: true

  # Forward error correction
  fec: true
